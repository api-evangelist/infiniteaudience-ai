components:
  schemas:
    MatchAddress:
      type: object
      additionalProperties: true
      required: []
      description: 'One additional address, tried as an extra match permutation alongside the record''s primary address. Only the keys listed here are read. Any other key (for example `street`, `line1`, or `postal`) is ignored and contributes nothing to matching, so rename such fields before sending. Include `address_1` in every entry. Send the ZIP code as `zip`. `zip5`, `postal_code`, and `zip_code` are accepted as aliases; when an entry carries more than one, the first non-empty value in the order `zip`, `zip5`, `postal_code`, `zip_code` is used.

        '
      properties:
        address_1:
          type: string
          description: Street address line 1.
        address_2:
          type: string
          description: Street address line 2 (apt, suite, etc.).
        city:
          type: string
        state:
          type: string
        zip:
          type: string
          description: ZIP code. Preferred key.
        zip5:
          type: string
          description: Alias for `zip`.
        postal_code:
          type: string
          description: Alias for `zip`.
        zip_code:
          type: string
          description: Alias for `zip`.
    MatchRun:
      type: object
      description: A single micro-batch match run record. `amount_charged` is a conservative pending-usage estimate, not a finalized invoice amount.
      required:
      - run_id
      - type
      - status
      - input_record_count
      - match_count
      - match_rate
      - amount_charged
      - field_list
      - created_at
      - expires_at
      - data_release
      properties:
        data_release:
          oneOf:
          - $ref: '#/components/schemas/EnrichmentRelease'
          - type: 'null'
        run_id:
          type: string
        type:
          type: string
          enum:
          - microbatch
        status:
          type: string
          enum:
          - completed
          - failed
        input_record_count:
          type: integer
        match_count:
          type: integer
        match_rate:
          type: number
          format: float
        amount_charged:
          type: number
          format: float
          description: Conservative USD estimate accepted for billing; not a finalized invoice total.
        field_list:
          type: array
          items:
            type: string
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      required:
      - error
      additionalProperties: true
      properties:
        error:
          type: string
          description: 'Stable machine-readable error code (e.g. `INVALID_STATUS_TRANSITION`, `BILLING_INSUFFICIENT_BALANCE`). Always present.

            '
        message:
          type: string
          description: Human-readable explanation of the error.
        code:
          type: string
          description: 'Alternate machine-readable code — present on some endpoints as an alias for `error` for backward compatibility.

            '
        request_id:
          type: string
          description: Opaque support/debug identifier when available.
        next_step:
          type: string
          description: Public action for correcting the request or retrying later.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FilterValidationIssue'
    MappingWarning:
      type: object
      required:
      - source_column
      - code
      - warning
      properties:
        source_column:
          type: string
          description: The uploaded file's column the warning is about.
        code:
          type: string
          enum:
          - analysis
          - nested_addresses
          description: '`analysis` is the automatic column analysis''s warning on a low-confidence mapping; `nested_addresses` is the platform''s check of the `addresses` column.

            '
        warning:
          type: string
    MatchRunList:
      type: object
      required:
      - runs
      - has_more
      - next_cursor
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/MatchRun'
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as cursor for the next page; null at the end.
    EnrichmentRelease:
      type: object
      required:
      - major
      - minor
      description: Delivered IAG refresh version. Independent of license status. Null provenance means unknown; a newer refresh-major can prompt a refresh through existing workflows. Active licenses and existing identity IDs support free refresh; normal charges may apply otherwise.
      properties:
        major:
          type: integer
          minimum: 1
        minor:
          type: integer
          minimum: 0
    FileMatchJob:
      type: object
      description: A file-based match job (matched-subtype segment)
      required:
      - match_id
      - name
      - status
      - matching_status
      - input_record_count
      - match_count
      - match_rate
      - amount_charged
      - file_format
      - compression
      - segment_id
      - audience_id
      - audience_status
      - source_job_id
      - created_at
      - expires_at
      - data_release
      properties:
        data_release:
          oneOf:
          - $ref: '#/components/schemas/EnrichmentRelease'
          - type: 'null'
        match_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - pending
          - active
          - failed
          - archived
          - expired
        matching_status:
          type:
          - string
          - 'null'
          enum:
          - pending
          - processing
          - completed
          - failed
          - null
        input_record_count:
          type:
          - integer
          - 'null'
        match_count:
          type:
          - integer
          - 'null'
        match_rate:
          type:
          - number
          - 'null'
          format: float
        amount_charged:
          type:
          - number
          - 'null'
          description: 'One-time file-match USD estimate accepted when this run first participates in a successful delivery. Null before first delivery; excludes the delivery''s separate audience/destination/field usage and is not a finalized invoice amount.

            '
        file_format:
          type:
          - string
          - 'null'
          enum:
          - csv
          - avro
          - json
          - jsonl
          - null
        compression:
          type: string
          enum:
          - none
          - gzip
          description: Input artifact compression, normalized to none for legacy jobs.
        column_mappings:
          type:
          - object
          - 'null'
          additionalProperties: true
        mapping_warnings:
          type:
          - array
          - 'null'
          description: 'Warnings about how the uploaded file''s columns are used. `analysis` entries are the automatic column analysis''s warnings on low-confidence mappings (below 0.6) that feed matching, and appear only when that analysis produced `column_mappings`. A `nested_addresses` entry is recomputed on every matching run, whoever supplied the mappings, when the `addresses` column has unrecognized keys or is not an array of address objects (it is then ignored). `null` before the first run''s analysis step. Returned by the single-job lookup only.

            '
