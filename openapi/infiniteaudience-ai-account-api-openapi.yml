openapi: 3.2.0
info:
  title: Infinite Audience Account API
  version: 1.0.0
  termsOfService: https://nofait.ai/terms
  license:
    name: Proprietary — All Rights Reserved
    url: https://nofait.ai/terms
  description: The primary REST API for Infinite Audience.
servers:
- url: https://api.infiniteaudience.ai
  description: Production API Server
security:
- bearerAuth: []
tags:
- name: Account
  description: Balance, top-up, and subscription management
paths:
  /v1/account/licenses:
    get:
      summary: Get organization licence reporting
      operationId: getOrgLicenseSummary
      description: 'Returns an organization-wide canonical licence snapshot: active and lapsed identities, monthly purchased terms, and upcoming expiries. Historic purchases include later-suppressed identities; active/lapsed/expiry counts exclude them. The response reports its timestamp and possible projection lag. It is not audience/store overlap, financial authority, or permission to purchase. This account reporting endpoint is REST-only; it does not launch work. Requires ''account'' scope.'
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Snapshot, explicitly stale snapshot, or unavailable counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgLicenseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/account/license-alerts:
    get:
      summary: Get organization licence expiry alert threshold
      operationId: getLicenseAlertSettings
      description: Returns the organization threshold for the monthly next-calendar-month expiry assessment. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAlertSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Set organization licence expiry alert threshold
      operationId: putLicenseAlertSettings
      description: Owner or admin only. Zero disables monthly alerts. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseAlertSettings'
      responses:
        '200':
          description: Updated threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAlertSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/account/billing:
    get:
      summary: Get native billing or setup readiness
      operationId: getAccountBilling
      description: Returns the native contract, attributed financial projection and collection readiness, independently of connected Shopify stores. Without a native route, returns native_setup_required without creating an account or contract. Shopify usage stays in the separate store reporting surface. Recovery projections remain readable while frozen. A parent-billed native child never receives the agency's pooled balance. Requires 'account-read' scope. First-party 'account' scope also suffices.
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Provider-neutral billing projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBillingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/account/auto-recharge:
    get:
      summary: Get prepaid automatic-recharge state
      operationId: getAccountAutoRecharge
      description: Returns the prepaid balance threshold configuration and a verified Stripe hosted-invoice URL only when customer action is required. Self-billed prepaid org owners only. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Automatic-recharge state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAutoRechargeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
    put:
      summary: Configure prepaid automatic recharge
      operationId: updateAccountAutoRecharge
      description: Persists recoverable intent, updates the active billing contract, and returns only a freshly re-read threshold projection. Enabling requires a ready Stripe payment method and billing address. Self-billed prepaid org owners only. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRechargeUpdateRequest'
      responses:
        '200':
          description: Updated automatic-recharge state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAutoRechargeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/credits:
    get:
      summary: List active paid commits and promotional credits
      operationId: getAccountCredits
      description: Reads active balance detail, including applicability and expiration. Parent-billed children cannot inspect their agency's pooled balances. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Active balance detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreditsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/invoices:
    get:
      summary: List invoices with hosted collection links
      operationId: getAccountInvoices
      description: Returns provider-rated commercial invoices and explicitly labelled administrator-created exceptional invoices, with collection status and hosted links. Parent-billed children cannot inspect agency invoices. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Invoice history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvoicesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/payment-method/setup:
    post:
      summary: Start Stripe payment-method onboarding for the billing account
      operationId: createAccountPaymentMethodSetup
      description: Creates a Stripe Checkout setup session for the Stripe customer linked to the source-routed billing account. It does not create or mutate a Stripe Subscription. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - success_url
              - cancel_url
              properties:
                success_url:
                  type: string
                  format: uri
                  maxLength: 2048
                cancel_url:
                  type: string
                  format: uri
                  maxLength: 2048
                tier:
                  type: string
                  enum:
                  - paygo
                  - pilot
                  - growth
                  - scale
                  - enterprise
                cadence:
                  type: string
                  enum:
                  - monthly
                  - annual
                commitment_term_months:
                  type: integer
                  enum:
                  - 0
                  - 12
                  - 24
                  - 36
                custom_commitment_amount_cents:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Hosted setup session
          content:
            application/json:
              schema:
                type: object
                required:
                - setup_url
                - session_id
                - billing_status
                properties:
                  setup_url:
                    type: string
                    format: uri
                  session_id:
                    type: string
                  billing_status:
                    type: string
                    const: awaiting_payment_method
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/account/topups:
    post:
      summary: Begin an idempotent credit top-up
      operationId: createAccountTopUp
      description: Creates a payment-gated prepaid balance purchase. The durable attempt is keyed by request_id; promotional credit is added only after Stripe payment is verified. Purchased and promotional value expire after 12 months. Prepay, self-billed org owners only. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              - amount_cents
              properties:
                request_id:
                  type: string
                  minLength: 8
                  maxLength: 160
                amount_cents:
                  type: integer
                  minimum: 10000
                  maximum: 5000000
      responses:
        '202':
          description: Durable top-up attempt accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - payment_attempt_id
                - request_id
                - status
                - amount_cents
                - bonus_cents
                - principal_credit_status
                - bonus_credit_status
                - credit_expires_after_months
                properties:
                  payment_attempt_id:
                    type: string
                  request_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - action_required
                    - paid
                    - failed
                  amount_cents:
                    type: integer
                    minimum: 10000
                  bonus_cents:
                    type: integer
                    minimum: 0
                  principal_credit_status:
                    $ref: '#/components/schemas/BillingCreditDeliveryStatus'
                  bonus_credit_status:
                    $ref: '#/components/schemas/BillingCreditDeliveryStatus'
                  credit_expires_after_months:
                    type: integer
                    const: 12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/topups/{requestId}:
    get:
      summary: Get durable top-up status
      operationId: getAccountTopUp
      description: Returns verified durable state for one top-up request. action_url is a Stripe hosted invoice only when customer action is required. Requires 'account-read' scope. First-party 'account' scope also suffices.
      tags:
      - Account
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Top-up status
          content:
            application/json:
              schema:
                type: object
                required:
                - payment_attempt_id
                - kind
                - request_id
                - status
                - amount_cents
                - bonus_cents
                - principal_credit_status
                - bonus_credit_status
                - action_url
                - paid_at
                - updated_at
                - last_error_code
                - credit_error_code
                properties:
                  payment_attempt_id:
                    type: string
                  kind:
                    type: string
                    const: topup
                  request_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - action_required
                    - paid
                    - failed
                  amount_cents:
                    type: integer
                  bonus_cents:
                    type: integer
                  principal_credit_status:
                    $ref: '#/components/schemas/BillingCreditDeliveryStatus'
                  bonus_credit_status:
                    $ref: '#/components/schemas/BillingCreditDeliveryStatus'
                  action_url:
                    type:
                    - string
                    - 'null'
                    format: uri
                  paid_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  last_error_code:
                    type:
                    - string
                    - 'null'
                  credit_error_code:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/account/topups/{requestId}/recheck:
    post:
      summary: Recheck a durable top-up against providers
      operationId: recheckAccountTopUp
      description: Re-fetches the original Metronome and Stripe objects and retries only a missing credit or promotional-credit component. It never creates or replays a charge. Self-billed org owners only. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rechecked top-up status
          content:
            application/json:
              schema:
                type: object
                required:
                - payment_attempt_id
                - kind
                - request_id
                - status
                - amount_cents
                - bonus_cents
                - principal_credit_status
                - bonus_credit_status
                - action_url
                - paid_at
                - updated_at
                - last_error_code
                - credit_error_code
                properties:
                  payment_attempt_id:
                    type: string
                  kind:
                    type: string
                    const: topup
                  request_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - action_required
                    - paid
                    - failed
                  amount_cents:
                    type: integer
                  bonus_cents:
                    type: integer
                  principal_credit_status:
                    $ref: '#/components/schemas/BillingCreditDeliveryStatus'
                  bonus_credit_status:
                    $ref: '#/components/schemas/BillingCreditDeliveryStatus'
                  action_url:
                    type:
                    - string
                    - 'null'
                    format: uri
                  paid_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  last_error_code:
                    type:
                    - string
                    - 'null'
                  credit_error_code:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/payment-method/portal:
    post:
      summary: Open Stripe payment-method and invoice-history settings
      operationId: createAccountPaymentMethodPortal
      description: Creates a Stripe Billing Portal session limited to payment-method management and Stripe collection history. Commercial terms remain authoritative in the Infinite Audience billing contract and cannot be changed in the portal. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - return_url
              properties:
                return_url:
                  type: string
                  maxLength: 2048
      responses:
        '200':
          description: Stripe portal session
          content:
            application/json:
              schema:
                type: object
                required:
                - portal_url
                properties:
                  portal_url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/contract/change:
    post:
      summary: Schedule a billing contract change
      operationId: changeAccountContract
      description: Schedules the selected tier and cadence at the next verified contract billing boundary. Enterprise custom terms remain platform-admin managed. Parent-billed children cannot change the agency contract. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              - tier
              properties:
                request_id:
                  type: string
                  minLength: 8
                  maxLength: 160
                tier:
                  type: string
                  enum:
                  - pilot
                  - growth
                  - scale
                cadence:
                  type: string
                  enum:
                  - monthly
                  - annual
      responses:
        '202':
          description: Contract replacement scheduled
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - effective_at
                - scheduled_change
                properties:
                  status:
                    type: string
                    const: scheduled
                  effective_at:
                    type: string
                    format: date-time
                  scheduled_change:
                    $ref: '#/components/schemas/BillingScheduledContractChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/contract/cancel:
    post:
      summary: Schedule contract cancellation
      operationId: cancelAccountContract
      description: Schedules cancellation at the later of the current billing-period end or contractual commitment end. An organisation owner is required. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              properties:
                request_id:
                  type: string
                  minLength: 8
                  maxLength: 160
      responses:
        '202':
          description: Cancellation scheduled
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - effective_at
                - scheduled_change
                properties:
                  status:
                    type: string
                    const: scheduled
                  effective_at:
                    type: string
                    format: date-time
                  scheduled_change:
                    $ref: '#/components/schemas/BillingScheduledContractChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/contract/cancellation/revert:
    post:
      summary: Revert a scheduled cancellation
      operationId: revertAccountContractCancellation
      description: Restores the billing contract end date before cancellation becomes effective. An organisation owner is required. Requires 'account' scope.
      tags:
      - Account
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              properties:
                request_id:
                  type: string
                  minLength: 8
                  maxLength: 160
      responses:
        '200':
          description: Cancellation reverted
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - scheduled_change
                properties:
                  status:
                    type: string
                    const: reverted
                  scheduled_change:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/account/usage:
    get:
      summary: Get aggregated usage metrics
      operationId: getAccountUsage
      description: 'Returns aggregated usage metrics for your organisation: segment and audience counts, deliveries created in the last 30 days, rated current-period spend, provider projection metadata, and compute ceiling usage as a percentage. Billing-model-agnostic — same shape for prepay and postpay/agency orgs.

        Requires ''account-read'' scope. First-party ''account'' scope also suffices.'
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 'Usage metrics.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - segment_count
                - audience_count
                - deliveries_30d
                - spend_30d_cents
                - compute_usage_pct
                properties:
                  segment_count:
                    type: integer
                  audience_count:
                    type: integer
                  deliveries_30d:
                    type: integer
                    description: Deliveries created in the last 30 days.
                  spend_30d_cents:
                    type: integer
                  compute_usage_pct:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      additionalProperties: true
      properties:
        error:
          type: string
          description: 'Stable machine-readable error code (e.g. `INVALID_STATUS_TRANSITION`, `BILLING_INSUFFICIENT_BALANCE`). Always present.

            '
        message:
          type: string
          description: Human-readable explanation of the error.
        code:
          type: string
          description: 'Alternate machine-readable code — present on some endpoints as an alias for `error` for backward compatibility.

            '
        request_id:
          type: string
          description: Opaque support/debug identifier when available.
        next_step:
          type: string
          description: Public action for correcting the request or retrying later.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FilterValidationIssue'
    BillingMoneyProjection:
      type: object
      required:
      - available_balance_cents
      - committed_balance_cents
      - promotional_balance_cents
      - current_period_spend_cents
      - current_invoice_total_cents
      - next_credit_expiry_at
      - active_reserved_cents
      - accepted_pending_cents
      - effective_available_cents
      properties:
        available_balance_cents:
          type:
          - integer
          - 'null'
        committed_balance_cents:
          type:
          - integer
          - 'null'
        promotional_balance_cents:
          type:
          - integer
          - 'null'
        current_period_spend_cents:
          type: integer
          minimum: 0
        current_invoice_total_cents:
          type:
          - integer
          - 'null'
        next_credit_expiry_at:
          type:
          - string
          - 'null'
          format: date-time
        active_reserved_cents:
          type: integer
          minimum: 0
        accepted_pending_cents:
          type: integer
          minimum: 0
        effective_available_cents:
          type:
          - integer
          - 'null'
    AccountInvoicesResponse:
      type: object
      required:
      - billing_account_id
      - authority
      - invoices
      properties:
        billing_account_id:
          type: string
        authority:
          type: string
          enum:
          - commercial
          - mixed
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoice'
    AutoRechargeUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      - enabled
      - threshold_cents
      - recharge_to_cents
      properties:
        request_id:
          type: string
          minLength: 8
          maxLength: 160
        enabled:
          type: boolean
        threshold_cents:
          type: integer
          minimum: 500
          maximum: 4999000
        recharge_to_cents:
          type: integer
          minimum: 1500
          maximum: 5000000
    AccountBillingResponse:
