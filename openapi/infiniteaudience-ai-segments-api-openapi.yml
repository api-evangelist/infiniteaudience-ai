  /v1/segments/{id}/duplicate:
    post:
      summary: Duplicate a segment with lineage tracking
      operationId: duplicateSegment
      description: 'Creates a new segment pre-populated from the source segment. Core and subtype-specific attributes are carried; underlying computed data (match results, lookalike/propensity scores) is referenced, never recomputed. Records parent_segment_id, derived_from (root ancestor — propagates through duplicate-of-duplicate chains), and parent_segment_version for lineage. The duplicate gets fresh created_at/updated_at and a fresh 90-day expires_at. No audience wrapper is created.


        **Per-subtype behavior:**


        - **filter** — status active, record_count reset to null (recount via

        `POST /v1/segments/{id}/count`), version history restarts at

        `current_version: 1`. A filter segment''s record_limit is copied; the

        duplicate''s seeded selection differs from the source''s.


        - **matched** — record_count and match_count carried. The duplicate

        references the source''s stored match results, so it stays deliverable

        without re-running the match. Sources with expired/failed status or incomplete match data

        are rejected with 409 SOURCE_MATCH_UNAVAILABLE.


        - **similarity/propensity** — seed/model references and record_count

        carried; the duplicate points at the same generated scores.


        Pending or failed sources are rejected with 409 SOURCE_NOT_READY.

        Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Source segment document ID.

          '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: 'Display name for the duplicate. Defaults to "<source name> (copy)".

                    '
      responses:
        '201':
          description: 'Duplicated segment created.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentObject'
              example:
                segment_id: seg_dup456
                data_release: null
                name: West Coast Adults 25-44 (copy)
                subtype: filter
                status: active
                record_count: null
                expires_at: '2026-10-03'
                visibility: org
                current_version: 1
                filters: []
                filter_groups:
                - id: g1
                  filters:
                  - field: state
                    op: IN
                    value:
                    - CA
                    - OR
                    - WA
                  combinator: AND
                parent_segment_id: seg_abc123
                derived_from: seg_abc123
                parent_segment_version: 3
                created_at: '2026-07-05T18:00:00Z'
                updated_at: '2026-07-05T18:00:00Z'
                integration_collection_provenance: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The source segment cannot be duplicated. SOURCE_MATCH_UNAVAILABLE — matched source whose status is pending/expired/failed or whose matching_status is incomplete (its match data cannot be referenced). SOURCE_NOT_READY — non-matched source with status pending or failed.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                - message
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - SOURCE_MATCH_UNAVAILABLE
                    - SOURCE_NOT_READY
                  message:
                    type: string
              example:
                error: Conflict
                code: SOURCE_MATCH_UNAVAILABLE
                message: The source segment's match data is unavailable (status 'expired'). Only matched segments with completed match data can be duplicated.
  /v1/segments/bulk:
    patch:
      summary: Bulk update segments
      operationId: bulkPatchSegments
      description: 'Apply the same name and/or status change to up to 50 segments in one request. Only name and status are bulk-patchable — they are valid across all four subtypes. Composition and subtype-specific attributes (filters, filter_groups, column_mappings) are rejected with 400 INVALID_FIELD; use `PATCH /v1/segments/{id}` for those. Best-effort per segment: each segment is updated independently and failures (not found, invalid status transition) are reported per id in the `failed` array — successful updates are never rolled back. The single-PATCH status transition rule applies per segment: only archived segments can be restored to active. Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - segment_ids
              properties:
                segment_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 50
                  description: IDs of segments to update (1-50).
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: New display name applied to every listed segment.
                status:
                  type: string
                  enum:
                  - active
                  - archived
                  description: 'New status applied to every listed segment. Only user-settable values are accepted; ''active'' is only valid on segments currently archived (per-segment failure otherwise).

                    '
      responses:
        '200':
          description: 'Bulk update processed. Per-segment failures, if any, are listed in `failed`.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - updated
                - failed
                properties:
                  updated:
                    type: integer
                    description: Number of segments successfully updated.
                  failed:
                    type: array
                    description: Segments that could not be updated.
                    items:
                      type: object
                      required:
                      - id
                      - error
                      properties:
                        id:
                          type: string
                        error:
                          type: string
              example:
                updated: 2
                failed:
                - id: seg_missing
                  error: Not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
    delete:
      summary: Bulk archive segments
      operationId: bulkArchiveSegments
      description: 'Archive up to 50 segments in one request by setting `status: archived`. Deliberately DIVERGES from `DELETE /v1/segments/{id}`: the single-segment DELETE permanently removes the segment (sets `deleted: true` behind a SEGMENT_IN_USE impact gate, dropping it out of every referencing audience''s composition), while bulk archive only changes status — archived segments remain fully resolvable by audiences that reference them, so composition integrity is preserved and no impact gate is needed. Fully reversible via `PATCH {status: active}` (single or bulk). Best-effort per segment: not-found/deleted ids are reported in the `failed` array; already-archived segments count as success (idempotent). Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - segment_ids
              properties:
                segment_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 50
                  description: IDs of segments to archive (1-50).
      responses:
        '200':
          description: 'Bulk archive processed. Per-segment failures, if any, are listed in `failed`.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - archived
                - failed
                properties:
                  archived:
                    type: integer
                    description: 'Number of segments now archived (includes already-archived segments, which are idempotent successes).

                      '
                  failed:
                    type: array
                    description: Segments that could not be archived.
                    items:
                      type: object
                      required:
                      - id
                      - error
                      properties:
                        id:
                          type: string
                        error:
                          type: string
              example:
                archived: 3
                failed:
                - id: seg_missing
                  error: Not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
  /v1/segments/bulk-delete:
    delete:
      summary: Bulk hard-delete segments
      operationId: bulkDeleteSegments
      description: 'Permanently delete up to 50 segments in one request — the bulk counterpart of `DELETE /v1/segments/{id}` (sets `deleted: true`, dropping each segment out of every referencing audience''s composition). Unlike the single-segment DELETE, there is no `confirm_impact` bypass here: a segment referenced by 1+ audiences is always skipped (never force-deleted) and reported back in `skipped`, since a bulk action has no per-segment confirmation UI to make an informed override decision. Delete the segment individually via `DELETE /v1/segments/{id}?confirm_impact=true` to force it. Best-effort per segment: not-found/already-deleted ids are reported in `failed`. Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - segment_ids
              properties:
                segment_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 50
                  description: IDs of segments to delete (1-50).
      responses:
        '200':
          description: 'Bulk delete processed. In-use segments and per-segment failures, if any, are listed in `skipped`/`failed` respectively.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - deleted
                - skipped
                - failed
                properties:
                  deleted:
                    type: integer
                    description: Number of segments permanently deleted.
                  skipped:
                    type: array
                    description: Segments left untouched because they're referenced by 1+ audiences.
                    items:
                      type: object
                      required:
                      - id
                      - audience_count
                      - campaign_count
                      properties:
                        id:
                          type: string
                        audience_count:
                          type: integer
                        campaign_count:
                          type: integer
                  failed:
                    type: array
                    description: Segments that could not be deleted (not found/already deleted).
                    items:
                      type: object
                      required:
                      - id
                      - error
                      properties:
                        id:
                          type: string
                        error:
                          type: string
              example:
                deleted: 1
                skipped:
                - id: seg_in_use
                  audience_count: 2
                  campaign_count: 1
                failed:
                - id: seg_missing
                  error: Not found
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
  /v1/segments/{id}/refresh:
    post:
      summary: Refresh a segment against the latest data
      operationId: refreshSegment
      description: 'Re-derives a single segment from the latest identity graph data. This is the segment-native counterpart of `POST /v1/audiences/{id}/refresh` — it updates ONLY this segment. Referencing audiences are never touched; their IDs are returned in `affected_audiences` so you can recount or refresh them as needed (use the audience-level refresh for a whole-composition refresh).


        **Per-subtype behavior:**


        - **filter** — Synchronous. Bumps `current_version` and appends a

        version history entry (sharing the same counter as PATCH filter

        edits), clears `record_count`, resets the 90-day TTL, and returns

        `status: active`. If nothing would change (already active, count

        already null, TTL already fresh today) and `force` is not set, the

        call is a no-op returning the current segment with

        `refreshed: false`.


        - **matched** — Returns a fresh presigned `upload_url` (24 h expiry) — or

        `upload_urls` (an array, one per shard) when `shard_count` > 1,

        in which case `upload_url` is absent. The new upload may be raw or

        gzip. With `hitl`

        unset/false (default): targets the segment''s existing upload path

        directly, resets mapping state (`column_mappings`,

        `mapping_confirmed`) and counts, and returns `status: pending` —

        re-upload your identity list and identity resolution runs

        automatically once every declared shard has been uploaded. With

        `hitl: true`: the URL(s) instead target a staging location and the

        segment''s status/mapping state is left untouched until you confirm

        — see the `hitl` field description below. Matched duplicates that

        share another segment''s data are rejected with 409

        SHARED_SOURCE_DATA — refresh the source segment instead. A saved

        integration-match segment owns its own lifecycle and remains refreshable.


        - **similarity** — Re-launches the lookalike generation workflow with

        the stored seed parameters. Returns `status: pending`; the segment''s

        `workflow_run_id` is updated to the new run. Poll

        `GET /v1/workflows/{workflow_run_id}` until completion.


        - **propensity** — Re-launches the scoring model workflow using the

        stored `positive_class_segment_id`. Returns `status: pending` plus

        the new `workflow_run_id`. 422 MISSING_POSITIVE_CLASS_ID for legacy

        segments that predate `positive_class_segment_id` storage — those

        must be recreated.


        Archived segments are rejected with 409 SEGMENT_ARCHIVED — restore first via `PATCH /v1/segments/{id}` with `status: active`.

        Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Segment document ID.

          '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hitl:
                  type: boolean
                  default: false
                  description: 'Requires an explicit confirmation step before the automated pipeline proceeds. **(similarity / propensity)** the re-launched workflow pauses at a human-in-the-loop review gate — use `POST /v1/workflows/{workflow_run_id}/resume` to submit answers and resume. **(matched)** the re-upload is staged instead of landing at the path that triggers automatic identity resolution — call `POST /v1/match/{id}/analyze` to preview column mappings against the staged file, then `POST /v1/segments/{id}/mappings` to confirm (moves the file into place and starts resolution) or `POST /v1/segments/{id}/mappings/cancel` to abort (the segment is left completely untouched). Ignored for filter.

                    '
                force:
                  type: boolean
                  default: false
                  description: '**(filter only)** Bump the version and invalidate the count even when the segment already looks fresh (skips the no-op short-circuit).

                    '
                shard_count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 1
                  description: '**(matched only)** Set > 1 for same-format shards. Every CSV shard must include the same header, and all shards must share schema and compression. Returns `upload_urls` instead of `upload_url`.

                    '
                compression:
                  type: string
                  enum:
                  - none
                  - gzip
                  default: none
                  description: '**(matched only)** Compression for this new upload. It does not inherit the previous upload''s setting. Send raw gzip bytes without Content-Encoding. gzip is not supported for avro-format segments — rejected with 400 UNSUPPORTED_INPUT_COMPRESSION.

                    '
      responses:
        '200':
          description: 'Segment refreshed (or no-op — inspect `refreshed`). Shape varies by subtype: matched adds `upload_url`/`upload_expires_at` (or `upload_urls` when `shard_count` > 1); similarity/propensity carry the new `workflow_run_id`. See `next_step` for a machine-readable hint.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentRefreshResult'
              example:
                segment_id: seg_abc123
                name: West Coast Adults 25-44
                subtype: filter
                status: active
                record_count: null
                expires_at: '2026-10-03'
                visibility: org
                current_version: 4
                filters: []
                filter_groups:
                - id: g1
                  filters:
                  - field: state
                    op: IN
                    value:
                    - CA
                    - OR
                    - WA
                  combinator: AND
                created_at: '2026-04-01T12:00:00Z'
                updated_at: '2026-07-05T18:00:00Z'
                refreshed: true
                affected_audiences:
                - aud_123
                - aud_456
                next_step: Call POST /v1/segments/{id}/count (recount) to refresh the record count. Referencing audiences are NOT auto-refreshed — recount or refresh the audiences listed in affected_audiences as needed.
                integration_collection_provenance: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The segment cannot be refreshed. SEGMENT_ARCHIVED — the segment is archived; restore it first (PATCH `status: active`). SHARED_SOURCE_DATA — matched duplicate that references another segment''s match data; refreshing it here would overwrite the source segment''s upload. The message names the source segment id to refresh instead.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                - message
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - SEGMENT_ARCHIVED
                    - SHARED_SOURCE_DATA
                  message:
                    type: string
              example:
                error: Conflict
                code: SHARED_SOURCE_DATA
                message: 'This matched segment is a duplicate that references segment ''seg_root1'' for its match data — refreshing it here would overwrite that source segment''s upload. Refresh the source segment instead: POST /v1/segments/seg_root1/refresh.'
        '422':
          description: 'MISSING_POSITIVE_CLASS_ID — **(propensity only)** the segment predates `positive_class_segment_id` storage and cannot be auto-refreshed; delete and recreate it.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                - message
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - MISSING_POSITIVE_CLASS_ID
                  message:
                    type: string
  /v1/segments/{id}/mappings:
    post:
      summary: Confirm column mapping overrides for a matched segment
      operationId: confirmSegmentMappings
      description: 'Stores confirmed column mapping overrides for a matched-subtype segment. Call this after reviewing the `POST /v1/match/{id}/analyze` response to correct any incorrect predictions. Sets `mapping_confirmed: true` so the platform skips its own analysis and uses these mappings directly.


        `column_mappings` may be omitted entirely — the platform then re-runs column analysis on the currently active upload itself and accepts its own suggested mapping as-is (the same behavior as reviewing `POST /v1/match/{id}/analyze` and confirming without edits, in one call). This can return 409 `FILE_NOT_YET_UPLOADED` if the file hasn''t finished uploading yet, or 422/400 on other analysis failures — pass `column_mappings` explicitly to skip re-analysis entirely.


        If the segment was created or refreshed with `hitl: true`, the upload is still staged (not yet at the path that triggers automatic resolution) — this call also moves the staged file into place and starts identity resolution, which is why it can return 500 `STAGING_COPY_FAILED` if that move fails (the segment is left unchanged in that case; retry the call). Use `POST /v1/segments/{id}/mappings/cancel` instead to abort a staged upload without confirming.

        Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Segment document ID.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                column_mappings:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Map of source column name → standard identity attribute name. Use `"(skip)"` as the value to explicitly exclude a column. Skip entries are stored and echoed back; a skipped column is never used for matching, even if its name equals a standard attribute (e.g. a column literally named `email`). Omit entirely (send `{}` or no body) to accept the platform''s own fresh column analysis of the active upload as-is.

                    '
      responses:
        '200':
          description: Mappings saved.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - column_mappings
                properties:
                  ok:
                    type: boolean
                  column_mappings:
                    type: object
                    additionalProperties:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: 'STAGING_COPY_FAILED — moving a staged (`hitl: true`) upload into place failed; the segment is unchanged, retry the call. ANALYSIS_FAILED — `column_mappings` was omitted and re-analysis failed unexpectedly.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                - message
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - STAGING_COPY_FAILED
                    - ANALYSIS_FAILED
                  message:
                    type: string
  /v1/segments/{id}/mappings/cancel:
    post:
      summary: Abort a staged (hitl:true) matched-segment upload without confirming
      operationId: cancelSegmentMappings
      description: 'Clears the staged upload created by a `hitl: true` call to `POST /v1/segments` or `POST /v1/segments/{id}/refresh`. Performs no file move and no status/mapping-state change — the segment is left exactly as it was before the upload was initiated. Idempotent: returns 200 even if nothing is currently staged.

        Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Segment document ID.
      responses:
        '200':
          description: Staged upload cleared (or already clear).
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/segments/{id}/upload-failed:
    post:
      summary: Report that a matched segment's client-side re-upload failed
      operationId: reportSegmentUploadFailed
      description: 'Called when a matched segment''s re-upload (kicked off by `POST /v1/segments/{id}/refresh` or `POST /v1/audiences/{id}/refresh`) fails client-side before ever reaching storage — e.g. a browser-side network or CORS failure on the presigned upload PUT. The async pipeline that would normally fail the segment never starts in that case, since no upload ever arrived, so without this call the segment (and any linked audience) would otherwise stay `pending` until a much slower backstop eventually catches it.


        Idempotent — a no-op (`already_resolved: true`) if the segment has already moved past `pending` (e.g. the upload actually succeeded). Only valid for matched-subtype segments.

        Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Segment document ID.

          '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                audience_id:
                  type: string
                  description: 'Optional linked audience to also mark failed, in addition to the segment''s own linked audience (if any).

                    '
                reason:
                  type: string
                  maxLength: 500
                  description: Human-readable failure reason.
      responses:
        '200':
          description: Segment (and any linked audience) marked failed, or already resolved.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - already_resolved
                properties:
                  ok:
                    type: boolean
                  already_resolved:
                    type: boolean
                    description: True if the segment had already moved past pending before this call.
              example:
                ok: true
                already_resolved: false
        '400':
          description: NOT_A_MATCHED_UPLOAD — only matched-subtype segments have an upload to report as failed.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                - message
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - NOT_A_MATCHED_UPLOAD
                  message:
                    type: string
              example:
                error: Bad Request
                code: NOT_A_MATCHED_UPLOAD
                message: Only matched-subtype segments have an upload to report as failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/segments/bulk-create:
    post:
      summary: Bulk create segments
      operationId: bulkCreateSegments
      description: 'Create up to 25 filter-subtype segments in one request. Each segment is created independently (own `versions/1` snapshot); failures are reported per item in `errors` and do not roll back successful items. Returns 201 when at least one segment was created, 400 (same body shape) when every item failed. Use `POST /v1/segments` individually for matched/similarity/propensity segments.

        Requires ''creator'' scope.


        Each item''s `filters`/`filter_groups` are validated against the live Field Catalog before it''s created — an unknown field, a disallowed operator, or an invalid enum value fails that item only, reported in `errors` (same as any other per-item failure). If the Field Catalog itself is temporarily unreachable, the entire request fails with 502 `FILTER_CATALOG_UNAVAILABLE` rather than creating some segments unvalidated.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - segments
              properties:
                campaign_id:
                  type: string
                  description: 'Campaign the whole batch is built for — every created segment''s `origin_campaign_id`, and the campaign each `create_audience` wrapper is linked to. Optional; same defaulting and 400 `INVALID_CAMPAIGN_ID` as `POST /v1/segments`.

                    '
                segments:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 120
                        description: Display name for the segment.
                      subtype:
                        type: string
                        enum:
                        - filter
                        - matched
                        - similarity
                        - propensity
                        default: filter
                        description: 'Only ''filter'' is supported by bulk-create — any other value fails per-item with an entry in `errors`.

                          '
                      filters:
                        type: array
                        items:
                          $ref: '#/components/schemas/Filter'
                        description: Legacy flat filter list.
                      filter_groups:
                        type: array
                        items:
                          $ref: '#/components/schemas/FilterGroup'
                        description: Filter groups defining the segment criteria.
                      count_snapshot:
                        type: number
                        minimum: 0
                        description: Optional known record count to seed the segment with.
                      record_limit:
                        type: integer
                        minimum: 1
                        maximum: 1000000000
                        description: Caps this filter segment at this many people; see POST /v1/segments.
                      create_audience:
                        type: boolean
                        default: false
                        description: 'When true, auto-creates a thin audience wrapper for this segment (returned as `audience_id` on the created segment).

                          '
      responses:
        '201':
          description: 'At least one segment created. Check `errors` for partial failures.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateSegmentsResult'
        '400':
          description: 'Every input item failed (`created: 0`) — same body shape as 201 with per-item reasons in `errors` — or the request body failed validation (standard error shape).

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BulkCreateSegmentsResult'
                - $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '502':
          description: Field Catalog temporarily unreachable — no items were validated or created (code FILTER_CATALOG_UNAVAILABLE).
components:
  responses:
    NotFound:
      description: Resource not found or not accessible to the calling org.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                error: Audience not found
    ScopeRequired:
      description: 'Token is valid but lacks the required scope for this endpoint. Check the endpoint description for the required scope (`discovery`, `purchase`, or `account`).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_scope:
              value:
                error: SCOPE_REQUIRED
                message: This endpoint requires the creator scope.
    Conflict:
      description: 'Resource state conflicts with the request. For upload analysis this includes FILE_NOT_YET_UPLOADED.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 'Missing or invalid Bearer token. Obtain one via POST /v1/auth/token. When a token was supplied but rejected, `code` distinguishes `TOKEN_EXPIRED` (the token''s lifetime has passed — request a new one via POST /v1/auth/token and retry) from `TOKEN_INVALID` (malformed or revoked — re-authenticate).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_token:
              value:
                error: 'Unauthorized: Missing or invalid Authorization header'
            token_expired:
              value:
                error: Unauthorized
                code: TOKEN_EXPIRED
                message: Your session has expired. Please sign in again.
    QueryExecutionError:
      description: 'The underlying analytics query failed, or (`AGGREGATION_FLOOR_NOT_MET`) a non-discovery route encountered a result below the privacy floor. `message` is always a friendly, client-safe description — the raw backend error is never returned.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            aggregation_floor_not_met:
              value:
                error: Bad Gateway
                code: AGGREGATION_FLOOR_NOT_MET
                message: For privacy reasons, a minimum of 50 records is required to view this information.
            table_missing:
              value:
                error: Bad Gateway
                code: BQ_TABLE_MISSING
                message: This data is missing — it may have expired or the original upload never finished processing. Try re-uploading, or contact support if this persists.
    BadGateway:
      description: An upstream billing provider rejected or could not complete the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AggregationFloorNotMet:
      description: The result is below the minimum population that can be returned while preserving privacy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Privacy threshold not met
            code: AGGREGATION_FLOOR_NOT_MET
            message: For privacy reasons, a minimum of 50 records is required to view this information.
    BadRequest:
      description: 'Invalid request — malformed body, missing required attribute, or failed validation. See `error` and `message` for details.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_error:
              value:
                error: Bad Request
                code: MISSING_SEGMENTS
                message: segment_ids is required for filter audiences.
    UnprocessableEntity:
      description: 'Request is structurally valid but the resource is in a state that prevents the operation (e.g. expired, pending, or not yet uploaded). See `error` and `code` for the specific reason.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            audience_expired:
              value:
                error: Audience expired
                code: AUDIENCE_EXPIRED
                message: This audience version expired. Run a refresh to create a new deliverable version.
            audience_pending:
              value:
                error: Audience not ready
                code: AUDIENCE_PENDING
                message: This audience is still being processed. Poll GET /v1/audiences/{id} until status is active.
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      additionalProperties: true
      properties:
        error:
          type: string
          description: 'Stable machine-readable error code (e.g. `INVALID_STATUS_TRANSITION`, `BILLING_INSUFFICIENT_BALANCE`). Always present.

            '
        message:
          type: string
          description: Human-readable explanation of the error.
        code:
          type: string
          description: 'Alternate machine-readable code — present on some endpoints as an alias for `error` for backward compatibility.

            '
        request_id:
          type: string
          description: Opaque support/debug identifier when available.
        next_step:
          type: string
          description: Public action for correcting the request or retrying later.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FilterValidationIssue'
    SegmentRefreshResult:
      description: 'Response of `POST /v1/segments/{id}/refresh` — the full updated segment document plus refresh metadata. For the matched subtype the response additionally carries upload_url / upload_expires_at (24 h presign) — or upload_urls (an array, one per shard) when shard_count > 1 was requested, in which case upload_url is absent; for similarity/propensity the segment''s workflow_run_id points at the newly launched run.

        '
      allOf:
      - $ref: '#/components/schemas/SegmentObject'
      - type: object
        required:
        - refreshed
        - affected_audiences
        - next_step
        properties:
          refreshed:
            type: boolean
            description: 'true when the segment was re-derived; false when the filter no-op path returned the current object unchanged (already active, count already null, TTL already fresh — pass force: true to bump anyway).

              '
          affected_audiences:
            type: array
            items:
              type: string
            description: 'IDs of non-deleted audiences that reference this segment. They are NOT auto-refreshed — their status, record_count, and expiry may now be stale. Recount or refresh them as needed, or use POST /v1/audiences/{id}/refresh for a whole-composition refresh.

              '
          next_step:
            type: string
            description: 'Human-readable hint for the calling agent on how to proceed (recount, upload to upload_url, or wait for the workflow).

              '
    SegmentObject:
      type: object
      required:
      - segment_id
      - name
      - subtype
      - status
      - record_count
      - expires_at
      - integration_collection_provenance
      - created_at
      - updated_at
      properties:
        data_release:
          oneOf:
          - $ref: '#/components/schemas/EnrichmentRelease'
          - type: 'null'
        integration_collection_provenance:
          oneOf:
          - $ref: '#/components/schemas/IntegrationCollectionProvenance'
          - type: 'null'
          description: Bounded source summary for a segment built from saved integration matches; null otherwise.
        segment_id:
          type: string
          description: Unique segment identifier
        name:
          type: string
          description: Display name of the segment
        subtype:
          type: string
          enum:
          - filter
          - matched
          - similarity
          - propensity
          description: 'Segment subtype. Determines which additional attributes are present. filter = saved filter criteria; matched = customer list upload with identity resolution; similarity = lookalike model; propensity = ML scoring model.

            '
        status:
          type: string
          enum:
          - pending
          - active
          - failed
          - archived
          - expired
          description: 'pending = computation in progress (matched/similarity/propensity during creation); active = fully ready; failed = workflow or enrichment error (see error_message); archived = hidden from the default segment catalog and new audience compositions, but otherwise fully functional — audiences that already reference an archived segment are unaffected, and it can be restored with PATCH status:active at any time. Distinct from DELETE, which is not reversible and does change referencing audiences'' composition; expired = past 90-day TTL.

            '
        record_count:
          type:
          - integer
          - 'null'
          description: Total matched/qualified records. Null while pending or if count has not been run.
        expires_at:
          type: string
          description: 'Date-only ISO string (90-day hard expiry from creation) for a persistent segment; a full ISO datetime (short, hour-granular TTL) while `ephemeral` is true.

            '
        visibility:
          type: string
          enum:
          - org
          - private
          description: 'org (default) — visible to all members of the org. private — visible only to the creating user.

            '
        current_version:
          type:
          - integer
          - 'null'
          description: filter subtype only. Current version counter.
        record_limit:
          type:
          - integer
          - 'null'
          description: filter subtype only — membership cap; null when uncapped (see POST /v1/segments)
        filter_groups:
          type: array
          items:
            $ref: '#/components/schemas/FilterGroup'
          description: filter subtype only. Complete saved definition; a single AND group represents a flat input.
        file_format:
          type:
          - string
          - 'null'
          enum:
          - csv
          - avro
          - json
          - jsonl
          description: matched subtype only. Input file format.
        compression:
          type:
          - string
          - 'null'
          enum:
          - none
          - gzip
          - null
          description: 'matched subtype only. Input artifact compression, normalized to none by current handlers.

            '
        shard_count:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 50
          description: 'matched subtype only. Number of same-format input objects, normalized to 1 for unsharded uploads.

            '
        column_mappings:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: 'matched subtype only. Source column name → standard identity attribute mappings. Populated after the analyze-and-store workflow gate runs.

            '
        mapping_confirmed:
          type:
          - boolean
          - 'null'
          description: matched subtype only. True once column mappings have been confirmed.
        input_record_count:
          type:
          - integer
          - 'null'
          description: matched subtype only. Number of rows in the original upload.
        match_count:
          type:
          - integer
          - 'null'
          description: matched subtype only. Rows that resolved to a known identity after enrichment.
        match_rate:
          type:
          - number
          - 'null'
          description: matched subtype only. match_count / input_record_count.
        upload_url:
          type:
          - string
          - 'null'
          description: 'matched subtype only. 30-minute signed upload URL. Present on create and refresh responses only, when shard_count was 1 (the default) — absent when sharded, use upload_urls instead.

            '
        upload_urls:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'matched subtype only. N signed upload URLs (index-ordered). Present on create and refresh responses only when shard_count > 1 was requested — upload_url is absent. Every CSV shard must include the same header row.

            '
        upload_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: matched subtype only. Expiry of upload_url/upload_urls.
        error_message:
          type:
          - string
          - 'null'
          description: 'Present when status is failed. Describes the reason for failure.

            '
        source_data_segment_id:
          type:
          - string
          - 'null'
          description: 'matched subtype only. Opaque, read-only reference to stored match results when they are shared or versioned independently from the segment metadata. Null when no separate result reference is needed.

            '
        seed_description:
          type:
          - string
          - 'null'
          description: similarity subtype only. Natural language ICP persona description used as seed.
        seed_segment_id:
          type:
          - string
          - 'null'
          description: similarity subtype only. ID of an existing segment used as the lookalike seed.
        workflow_run_id:
          type:
          - string
          - 'null'
          description: 'similarity and propensity subtypes. The workflow run ID. Poll GET /v1/workflows/{workflow_run_id} to monitor progress.

            '
        positive_class_segment_id:
          type:
          - string
          - 'null'
          description: propensity subtype only. ID of the segment whose members are the positive training class.
        parent_segment_id:
          type:
          - string
          - 'null'
          description: ID of the segment this was duplicated or derived from, if applicable.
        derived_from:
          type:
          - string
          - 'null'
          description: 'Root ancestor segment ID. Stable across duplicate-of-duplicate chains — always points at the original segment, never an intermediate duplicate.

            '
        parent_segment_version:
          type:
          - integer
          - 'null'
          description: 'Version of the parent segment pinned at duplicate time (current_version for filter parents; snapshot_version otherwise). Null on segments that are not duplicates.

            '
        origin_campaign_id:
          type:
          - string
          - 'null'
          description: 'ID of the campaign whose chat session first produced this segment. Metadata only — does not restrict the segment to that campaign. Present only when the segment was created via POST /v1/segments with a campaign_id.

            '
        usage:
          type: object
          description: 'Cross-campaign usage stats. Only present on GET /v1/segments/{id} — not included on list responses. Useful for understanding impact before archiving.

            '
          properties:
            audience_count:
              type: integer
              description: Number of active audiences that reference this segment.
            campaign_count:
              type: integer
              description: Number of distinct campaigns those audiences belong to.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Filter:
      type: object
      description: A single filter condition for audience discovery or job execution
      required:
      - field
      - op
      properties:
        field:
          type: string
          description: Canonical catalog field_name (e.g. age or state). ZIP5 also accepts zip, zip_code, or postal_code as input aliases; saved responses use zip5.
        op:
          type: string
          enum:
          - '='
          - '!='
          - <
          - <=
          - '>'
          - '>='
          - IN
          - NOT IN
          - BETWEEN
          - LIKE
          - ARRAY_CONTAINS
          - ARRAY_CONTAINS_ANY
          - IS NULL
          - IS NOT NULL
          description: Comparison operator
        text_comparison:
          type: string
          enum:
          - exact
          - case_insensitive
          description: 'Optional STRING comparison mode for =, !=, IN, NOT IN, and LIKE, or ARRAY<STRING> membership mode for ARRAY_CONTAINS and ARRAY_CONTAINS_ANY. Defaults to exact. Case-insensitive mode applies Unicode case folding to both the stored value and the supplied value.

            '
        trim_whitespace:
          type: boolean
          description: 'Optionally trim leading and trailing whitespace on both sides of a STRING or ARRAY<STRING> comparison. Defaults to false; independent of text_comparison.

            '
        value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              oneOf:
              - type: string
              - type: number
          description: 'The value to match against. For state, a published two-letter code or full State name is accepted and normalized to the code. Scalar types (`string`, `number`, `boolean`) are used for single-value operators (`=`, `!=`, `<`, `<=`, `>`, `>=`, `LIKE`, `ARRAY_CONTAINS`). Pass an **array** for `IN`, `NOT IN`, and `ARRAY_CONTAINS_ANY` — pass the array directly with no comma-encoding. `BETWEEN` takes a two-element array `[low, high]`. Omit entirely for `IS NULL` / `IS NOT NULL` checks.

            '
    BulkCreateSegmentsResult:
      type: object
      description: 'Result of POST /v1/segments/bulk-create. Returned with 201 when at least one segment was created, and with 400 (same shape) when every item failed.

        '
      required:
      - created
      - failed
      - segments
      - errors
      properties:
        created:
          type: integer
          description: Number of segments successfully created.
        failed:
          type: integer
          description: Number of input items that could not be created.
        segments:
          type: array
          description: Full segment documents for each successfully created segment.
          items:
            allOf:
            - $ref: '#/components/schemas/SegmentObject'
            - type: object
              properties:
                audience_id:
                  type: string
                  description: 'Auto-created audience wrapper ID. Present only when the input item set create_audience: true.

                    '
        errors:
          type: array
          description: Per-item failures. Empty when all items succeeded.
          items:
            type: object
            required:
            - index
            - name
            - error
            properties:
              index:
                type: integer
                description: Zero-based position of the failed item in the input `segments` array.
              name:
                type: string
                description: The `name` from the failed input item.
              error:
                type: string
                description: Human-readable reason the segment could not be created.
    FilterGroup:
      type: object
      description: "A group of Filter conditions. All `filters` within a single group are **always ANDed together** — there is no per-group intra-operator. The `combinator` attribute is an **inter-group** operator: it controls how this group is joined to the immediately preceding group in the array. The `combinator` on the first group (index 0) is always ignored.\n\nExample — `(city = \"NYC\" AND state = \"NY\") OR (state = \"CA\")`:\n```json [\n  { \"id\": \"g1\", \"filters\": [{\"field\":\"city\",\"op\":\"=\",\"value\":\"NYC\"},\n                            {\"field\":\"state\",\"op\":\"=\",\"value\":\"NY\"}],\n    \"combinator\": \"AND\" },\n  { \"id\": \"g2\", \"filters\": [{\"field\":\"state\",\"op\":\"=\",\"value\":\"CA\"}],\n    \"combinator\": \"OR\" }\n] ```\nGroup g1's `combinator` is irrelevant (it is the first group). Group g2's `combinator: \"OR\"` means the result is `(g1) OR (g2)`.\n"
      required:
      - id
      - filters
      - combinator
      properties:
        id:
          type: string
          description: 'Stable identifier (UUID or NanoID). Used to track groups across edits.

            '
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
          description: 'One or more filter conditions. All conditions in this array are combined with AND. Provide at least one filter per group.

            '
        combinator:
          type: string
          enum:
          - AND
          - OR
          description: '**Inter-group operator.** Joins this group to the previous group in the array. `AND` narrows the result; `OR` broadens it. Ignored on the first group (index 0) — that group has no predecessor to join.

            '
    IntegrationCollectionProvenance:
      type: object
      additionalProperties: false
      required:
      - version
      - materialization_id
      - collection_id
      - mode
      - providers
      - connection_count
      - source_cutoff_at
      - source_observations
      - unique_identities
      - materialized_at
      properties:
        version:
          type: integer
          const: 1
        materialization_id:
          type: string
          pattern: ^imm_[a-f0-9]{40}$
        collection_id:
          type: string
        mode:
          type: string
          enum:
          - new_segment
          - add_to_segment
        providers:
          type: array
          items:
            type: string
        connection_count:
          type: integer
          minimum: 0
        source_cutoff_at:
          type: string
          format: date-time
        source_observations:
          type: integer
          minimum: 0
        unique_identities:
          type: integer
          minimum: 0
        materialized_at:
          type: string
          format: date-time
    FilterValidationIssue:
      type: object
      required:
      - path
      - code
      - message
      properties:
        path:
          type: string
          description: JSON path to the invalid filter field or value.
        code:
          type: string
          enum:
          - INVALID_FILTER_SHAPE
          - UNKNOWN_FILTER_FIELD
          - FIELD_NOT_FILTERABLE
          - UNSUPPORTED_FILTER_OPERATOR
          - UNSUPPORTED_TEXT_COMPARISON
          - INVALID_FILTER_VALUE
          - INVALID_ENUM_VALUE
          - AMBIGUOUS_ENUM_VALUE
        message:
          type: string
        suggestions:
          type: array
          items:
            type: string
    EnrichmentRelease:
      type: object
      required:
      - major
      - minor
      description: Delivered IAG refresh version. Independent of license status. Null provenance means unknown; a newer refresh-major can prompt a refresh through existing workflows. Active licenses and existing identity IDs support free refresh; normal charges may apply otherwise.
      properties:
        major:
          type: integer
          minimum: 1
        minor:
          type: integer
          minimum: 0
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token
      description: Person-bound MCP OAuth bearer with the openid scope for UserInfo.
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer access token obtained from POST /v1/auth/token. Include in all protected requests as: Authorization: Bearer <access_token>

        '
