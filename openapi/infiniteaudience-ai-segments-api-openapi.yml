openapi: 3.2.0
info:
  title: Infinite Audience Segments API
  version: 1.0.0
  termsOfService: https://nofait.ai/terms
  license:
    name: Proprietary — All Rights Reserved
    url: https://nofait.ai/terms
  description: The primary REST API for Infinite Audience.
servers:
- url: https://api.infiniteaudience.ai
  description: Production API Server
security:
- bearerAuth: []
tags:
- name: Segments
  description: Save and manage reusable filter definitions
paths:
  /v1/segments:
    post:
      summary: Create a segment
      operationId: createSegment
      description: 'Creates a typed cohort definition (segment). The `subtype` attribute controls which additional parameters are required and what the platform does next.


        **Subtypes:**


        - **filter** (default) — Saves a named filter expression. Returns `status: active`

        immediately. Use `filters`/`filter_groups` for the criteria.

        Pass `create_audience: true` to also create a thin audience wrapper

        referencing this segment. Default: `false` — the segment is saved for

        later composition into an audience once iterative refinement is complete.


        - **matched** — Upload your own customer list for identity resolution.

        Returns `status: pending` + `upload_url` (30-minute signed upload URL) —

        or `upload_urls` (an array, one per shard) when `shard_count` > 1,

        in which case `upload_url` is absent. Input may be raw or gzip.

        With `hitl` unset/false (default): upload your file(s) and the platform

        runs column mapping and identity resolution automatically once every

        declared shard has been uploaded, transitioning

        to `status: active` when complete — no further calls required. With

        `hitl: true`: the upload is staged instead of resolving automatically —

        see the `hitl` field description below for the full preview/confirm/cancel

        sequence. When `create_audience: true` (default for matched), a thin

        audience wrapper is also created automatically.


        - **similarity** — Lookalike modelling. Provide `seed_description` (natural language

        ICP persona) or `seed_segment_id` (an existing segment) — not both — to launch a

        new workflow. Returns `status: pending` + `workflow_run_id`.

        Alternatively, provide `generation_metadata_id` (an existing `icp_id`) with no seed

        fields to attach that already-completed ICP run directly — no workflow is launched,

        `status: active` immediately. Default `create_audience: false`.


        - **propensity** — ML propensity scoring. Provide `positive_class_segment_id`

        (an existing segment whose members are the positive training class) to launch a

        new workflow. Returns `status: pending` + `workflow_run_id`.

        Alternatively, provide `generation_metadata_id` (an existing `model_id`) with no

        `positive_class_segment_id` to attach that already-completed model run directly —

        no workflow is launched, `status: active` immediately. Default `create_audience: false`.


        Poll `GET /v1/segments/{id}` for status, or configure a webhook to receive `segment.ready` / `segment.failed` events.

        Requires ''creator'' scope.


        For `filter` subtype: `filters`/`filter_groups` are validated against the live Field Catalog before the segment is created — an unknown field, a disallowed operator for that field, or an invalid enum value returns 400 `INVALID_FILTER`. If the Field Catalog itself is temporarily unreachable, returns 502 `FILTER_CATALOG_UNAVAILABLE` rather than creating an unvalidated segment. `record_limit` on a non-filter subtype returns 400 `RECORD_LIMIT_UNSUPPORTED`. When `create_audience` is true, an unknown `campaign_id` returns 400 `INVALID_CAMPAIGN_ID` and nothing is created.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: 'Display name for the segment.

                    '
                subtype:
                  type: string
                  enum:
                  - filter
                  - matched
                  - similarity
                  - propensity
                  default: filter
                  description: 'Segment subtype. Determines which additional attributes are required.

                    '
                create_audience:
                  type: boolean
                  description: 'When true, automatically creates a thin audience wrapper referencing this segment. Defaults: filter=true, matched=true, similarity=false, propensity=false.

                    '
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/Filter'
                  description: filter subtype only. Flat filter array (legacy). Prefer filter_groups.
                filter_groups:
                  type: array
                  items:
                    $ref: '#/components/schemas/FilterGroup'
                  description: filter subtype only. Grouped filter conditions.
                record_limit:
                  type: integer
                  minimum: 1
                  maximum: 1000000000
                  description: 'filter subtype only. Caps the segment at this many people. Requires a State, City, or ZIP Code filter that narrows every OR branch to at most 100 ZIP3 regions; otherwise returns 400 CAP_GEOGRAPHY_REQUIRED. Members are a stable, segment-seeded pseudo-random selection of the people matching the filters (the same people on every count, audience composition, quote, and delivery for a given data release). Audiences and deliveries built from the segment inherit the cap — there is no separate audience- or delivery-level cap. A delivery may export fewer rows than the cap after privacy suppression. When count_snapshot is supplied it is clamped to the cap.

                    '
                file_format:
                  type: string
                  enum:
                  - csv
                  - avro
                  - json
                  - jsonl
                  default: csv
                  description: 'matched subtype only. Input file format. csv (default) treats every column as a single scalar value — multi-value/array attributes are not supported in csv. avro, json, and jsonl support native array columns for attributes that require them — json and jsonl are both parsed as newline-delimited JSON (one record object per line), not a single top-level JSON array.

                    '
                compression:
                  type: string
                  enum:
                  - none
                  - gzip
                  default: none
                  description: 'matched subtype only. gzip means the complete underlying format file is a gzip stream. Upload raw gzip bytes using the underlying format''s Content-Type and no Content-Encoding. gzip is not supported with file_format=avro (avro is already internally compressed) — rejected with 400 UNSUPPORTED_INPUT_COMPRESSION.

                    '
                match_level:
                  type: array
                  items:
                    type: string
                    enum:
                    - I
                    - H
                    - D
                    - S
                    - A
                  description: 'matched subtype only. Restricts identity resolution to the selected match levels. Defaults to all five levels.

                    '
                spatial_mode:
                  type: string
                  enum:
                  - residential
                  - work
                  - auto
                  default: residential
                  description: 'matched subtype only. Phase 3 spatial trade-area profile; residential is the default, work selects workplace-oriented matching, and auto dynamically selects commuter expansion based on whether the input address is commercial.

                    '
                shard_count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 1
                  description: 'matched subtype only. Set > 1 for same-format shards. Every CSV shard must include the same header row, and all shards must share schema and compression. Returns upload_urls instead of upload_url.

                    '
                session_id:
                  type: string
                  description: 'Optional chat session identifier used to reconnect progress for an asynchronously generated similarity or propensity segment.

                    '
                seed_description:
                  type: string
                  description: 'similarity subtype only. Natural language description of the target ICP persona. Provide either seed_description or seed_segment_id, not both.

                    '
                seed_segment_id:
                  type: string
                  description: 'similarity subtype only. ID of an existing segment to use as the lookalike seed. Provide either seed_description or seed_segment_id, not both.

                    '
                positive_class_segment_id:
                  type: string
                  description: 'propensity subtype only. ID of an existing segment whose members represent the positive training class for ML model training.

                    '
                model_type:
                  type: string
                  enum:
                  - BOOSTED_TREE_CLASSIFIER
                  - AUTOML_CLASSIFIER
                  - LOGISTIC_REG
                  default: BOOSTED_TREE_CLASSIFIER
                  description: propensity subtype only. BQML classifier type.
                excluded_columns:
                  type: string
                  description: propensity subtype only. Comma-prefixed feature columns excluded to prevent target leakage.
                model_name:
                  type: string
                  description: propensity subtype only. Human-readable model name.
                generation_metadata_id:
                  type: string
                  description: 'similarity subtype: an existing icp_id. propensity subtype: an existing model_id. When provided without seed_description/seed_segment_id (similarity) or positive_class_segment_id (propensity), attaches that already-completed run to a new segment instead of launching a new workflow — status: active immediately, no workflow_run_id.

                    '
                visibility:
                  type: string
                  enum:
                  - org
                  - private
                  description: 'org (default) — visible to all org members. private — visible only to creator.

                    '
                hitl:
                  type: boolean
                  default: false
                  description: 'Requires an explicit confirmation step before the automated pipeline proceeds. For similarity/propensity, the workflow pauses at a human-in-the-loop review gate. For matched, the uploaded file is staged instead of landing at the path that triggers automatic identity resolution — call `POST /v1/match/{id}/analyze` to preview column mappings against the staged file, then `POST /v1/segments/{id}/mappings` to confirm (moves the file into place and starts resolution) or `POST /v1/segments/{id}/mappings/cancel` to abort (the segment is left completely untouched). Defaults to false — omit for the existing automatic-resolution behavior.

                    '
                campaign_id:
                  type: string
                  description: 'Campaign this segment is built for. Recorded as the segment''s `origin_campaign_id` and, with `create_audience`, links the wrapper audience to it. Optional — when omitted, a delegated chat/A2A session''s campaign is used, otherwise the segment has no campaign. An unknown id is a 400 `INVALID_CAMPAIGN_ID` and nothing is created.

                    '
                webhook_url:
                  type: string
                  format: uri
                  description: 'Optional HTTPS URL to receive segment.ready or segment.failed events. Overrides the org-level webhook URL for this request only.

                    '
                ephemeral:
                  type: boolean
                  default: false
                  description: 'filter subtype only. When true, creates a scratch/free/auto-expiring segment with a short, hour-granular TTL instead of the standard 90-day expiry. Excluded from `GET /v1/segments` by default (see `include_ephemeral` there). Promote it to persistent later via `PATCH /v1/segments/{id} {ephemeral: false}`, or implicitly by composing it into an audience. Defaults to `false` (persistent, today''s behavior).

                    '
            examples:
              filter:
                summary: Filter segment
                value:
                  name: West Coast Adults 25-44
                  subtype: filter
                  filter_groups:
                  - id: g1
                    filters:
                    - field: state
                      op: IN
                      value:
                      - CA
                      - OR
                      - WA
                    combinator: AND
                  create_audience: true
              matched:
                summary: Matched segment (customer CSV upload)
                value:
                  name: Q3 CRM Upload
                  subtype: matched
                  file_format: csv
                  create_audience: true
              similarity:
                summary: Similarity segment (lookalike)
                value:
                  name: Lookalike of best customers
                  subtype: similarity
                  seed_description: Homeowners aged 35-55 with household income above $80k
                  hitl: false
              propensity:
                summary: Propensity segment (ML scoring)
                value:
                  name: High-Intent Refinance Prospects
                  subtype: propensity
                  positive_class_segment_id: seg_abc123
      responses:
        '201':
          description: 'Segment created.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - segment_id
                - name
                - subtype
                - status
                - record_count
                - expires_at
                - created_at
                - updated_at
                properties:
                  segment_id:
                    type: string
                  name:
                    type: string
                  subtype:
                    type: string
                    enum:
                    - filter
                    - matched
                    - similarity
                    - propensity
                  status:
                    type: string
                    enum:
                    - pending
                    - active
                    - failed
                    - archived
                    - expired
                  record_count:
                    type:
                    - integer
                    - 'null'
                  expires_at:
                    type: string
                    description: 'Date-only ISO string (90-day expiry) for a persistent segment; a full ISO datetime (short, hour-granular TTL) while `ephemeral` is true.

                      '
                  ephemeral:
                    type: boolean
                    description: 'True for a scratch/auto-expiring filter-subtype segment. Absent/false reads as persistent.

                      '
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  upload_url:
                    type:
                    - string
                    - 'null'
                    description: 'matched subtype only. 30-minute signed upload URL. Present when shard_count was 1 (the default) — absent when sharded, use upload_urls instead.

                      '
                  upload_urls:
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                    description: 'matched subtype only. N signed upload URLs (index-ordered). Present only when shard_count > 1 was requested — upload_url is absent. Every CSV shard must include the same header row.

                      '
                  compression:
                    type:
                    - string
                    - 'null'
                    enum:
                    - none
                    - gzip
                    - null
                    description: matched subtype only. Input artifact compression.
                  upload_expires_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: matched subtype only. Expiry of upload_url/upload_urls.
                  workflow_run_id:
                    type:
                    - string
                    - 'null'
                    description: similarity/propensity subtypes. Workflow run ID for progress monitoring.
                  audience_id:
                    type:
                    - string
                    - 'null'
                    description: 'If create_audience was true, the ID of the auto-created audience wrapper. Null otherwise.

                      '
              examples:
                filter_response:
                  summary: Filter segment created
                  value:
                    segment_id: seg_abc123
                    name: West Coast Adults 25-44
                    subtype: filter
                    status: active
                    record_count: null
                    expires_at: '2026-09-27'
                    audience_id: aud_abc123
                    created_at: '2026-06-22T18:00:00Z'
                    updated_at: '2026-06-22T18:00:00Z'
                matched_response:
                  summary: Matched segment created — ready for file upload
                  value:
                    segment_id: seg_m789
                    name: Q3 CRM Upload
                    subtype: matched
                    status: pending
                    record_count: null
                    expires_at: '2026-09-27'
                    upload_url: https://storage.googleapis.com/cf-uploads/enrichment-uploads/org_x/seg_m789/input.csv?X-Goog-Signature=...
                    upload_expires_at: '2026-06-22T19:30:00.000Z'
                    audience_id: aud_m789
                    created_at: '2026-06-22T18:00:00Z'
                    updated_at: '2026-06-22T18:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '502':
          description: Field Catalog temporarily unreachable — filters could not be validated (code FILTER_CATALOG_UNAVAILABLE).
    get:
      summary: List segments for the caller's org
      operationId: listSegments
      description: 'Returns all segments for the org, newest first. Supports filtering by subtype and status. Archived and expired segments are excluded by default unless explicitly requested. Listing emits no billable usage.

        Requires ''discovery'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: subtype
        in: query
        schema:
          type: string
          enum:
          - filter
          - matched
          - similarity
          - propensity
        description: 'Filter to a specific segment subtype.

          '
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - active
          - failed
          - archived
          - expired
        description: 'Filter by lifecycle status. archived/expired segments are excluded by default.

          '
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
        description: When true, archived segments are included in results.
      - name: include_ephemeral
        in: query
        schema:
          type: boolean
          default: false
        description: 'When true, ephemeral (scratch/auto-expiring) segments are included in results. Excluded by default.

          '
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Maximum number of results to return (max 100).
      - name: cursor
        in: query
        schema:
          type: string
        description: Cursor from a previous response's `next_cursor` attribute to fetch the next page.
      responses:
        '200':
          description: 'Segment list.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/SegmentObject'
                  total:
                    type: integer
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as `cursor` on the next request. Null when no further pages exist.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
  /v1/segments/{id}:
    get:
      summary: Get a segment by ID
      operationId: getSegment
      description: 'Returns the full segment document including subtype-specific attributes, current record count, and lifecycle status. Also includes a `usage` object with `audience_count` and `campaign_count` showing how many audiences and campaigns currently reference this segment. Reading the segment emits no billable usage.

        Requires ''discovery'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Segment document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Partially update a segment
      operationId: patchSegment
      description: 'Applies a partial update to a segment. Only provided attributes are updated.


        **Allowed updates by subtype:**


        - **filter** — `name`, `filters`, `filter_groups`, `record_limit`, `status` (archived/active), `ephemeral`

        - **matched** — `name`, `column_mappings`, `status` (archived/active), `ephemeral` promotion

        - **similarity / propensity** — `name`, `status` (archived/active)


        **Standalone promotion:** `ephemeral: false` promotes a scratch (ephemeral) segment to persistent in-place — resets its expiry to the standard 90-day TTL and reactivates it if it had lazily expired. Only `false` is honored; `true` (demoting a persistent segment back to scratch) is not supported and is silently ignored.


        **Count invalidation:** updating filter criteria does NOT automatically recompute record counts on audiences referencing this segment. Call `POST /v1/segments/{id}/count` to recompute.


        The update itself emits no billable usage.

        Requires ''creator'' scope.


        When `filters`/`filter_groups` are provided, they''re validated against the live Field Catalog before the update is applied — an unknown field, a disallowed operator, or an invalid enum value returns 400 `INVALID_FILTER`. If the Field Catalog is temporarily unreachable, returns 502 `FILTER_CATALOG_UNAVAILABLE` rather than applying an unvalidated update. `record_limit` on a non-filter segment returns 400 `RECORD_LIMIT_UNSUPPORTED`.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Rename the segment.
                status:
                  type: string
                  enum:
                  - archived
                  - active
                  description: 'Valid user-settable transitions: archived or active (restore from archived). System-managed statuses (pending, failed, expired) cannot be set via this endpoint.


                    Archiving is always safe and reversible: it never affects audiences that already reference this segment (see the `SegmentObject` `status` attribute docs for why). Archived segments are excluded from the default `GET /v1/segments` list (pass `?include_archived=true` to include them) and from new audience compositions, but remain fully readable via `GET /v1/segments/{id}` and can be restored with `status: active` at any time.

                    '
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/Filter'
                  description: filter subtype only. Replace the filter array.
                filter_groups:
                  type: array
                  items:
                    $ref: '#/components/schemas/FilterGroup'
                  description: filter subtype only. Replace filter groups.
                record_limit:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 1000000000
                  description: 'filter subtype only. Sets or replaces the cap; null removes it; a cap requires State, City, or ZIP Code filters narrowing every OR branch to at most 100 ZIP3 regions (400 CAP_GEOGRAPHY_REQUIRED); omit to leave it unchanged. A change versions the segment like a filter edit (current_version increments).

                    '
                count_snapshot:
                  type: number
                  minimum: 0
                  description: 'filter subtype only. Verified count of the new definition, stored with a filters/filter_groups/record_limit change (clamped to the cap). Any definition change resets record_count; without count_snapshot it stays null until recounted (POST /v1/segments/{id}/count). Every audience that references the segment also has its record_count cleared and is recounted in the background.

                    '
                column_mappings:
                  type: object
                  additionalProperties:
                    type: string
                  description: matched subtype only. Update column-to-identity-attribute mappings.
                ephemeral:
                  type: boolean
                  description: 'Standalone "save this scratch segment" promotion for any ephemeral segment subtype — see the endpoint description above. Only `false` is honored.

                    '
      responses:
        '200':
          description: 'Updated segment.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      summary: Permanently remove a segment
      operationId: deleteSegment
      description: 'Removes the segment from every read surface: `GET /v1/segments/{id}` returns 404 afterward, and `GET /v1/segments` always excludes it (there is no override, unlike archived segments). There is no restore endpoint — this is a one-way operation from the API''s perspective, even though the underlying record is retained internally rather than hard-deleted.


        **Effect on audiences:** unlike archiving, deleting a segment that''s referenced by one or more audiences changes those audiences'' composition — the segment is dropped from their resolved segment list and record count. This is the reason for the impact check below; archiving has no such check because it never has this effect.


        **Impact check:** if the segment is referenced by one or more active audiences, the server returns a 409 with `audience_count`, `campaign_count`, and an `audiences` list. Re-submit with `?confirm_impact=true` to proceed anyway.


        Not idempotent: calling this twice returns 404 on the second call, since the segment is already excluded from lookup after the first delete. No credits are debited.

        Requires ''creator'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: confirm_impact
        in: query
        required: false
        schema:
          type: boolean
        description: 'Pass `true` to delete a segment that is referenced by active audiences. Omitting this parameter on an in-use segment returns a 409 with impact details.

          '
      responses:
        '204':
          description: 'Segment successfully deleted (archived).

            '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Segment is referenced by one or more active audiences. Response body includes impact details. Re-submit with `?confirm_impact=true` to delete anyway.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                - message
                - audience_count
                - campaign_count
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - SEGMENT_IN_USE
                  message:
                    type: string
                  audience_count:
                    type: integer
                  campaign_count:
                    type: integer
                  audiences:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - campaign_id
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        campaign_id:
                          type:
                          - string
                          - 'null'
                          description: The campaign the audience belongs to, or null.
  /v1/segments/{id}/count:
    post:
      summary: Recount a segment
      operationId: countSegment
      description: 'Triggers a record count computation for the segment. Runs a fresh computed count for every subtype: filter segments count directly against their own filter definition and update `record_count`; matched/similarity/propensity segments run the same composed count used by audience/delivery counting (a 1-membership composition), rather than echoing a possibly-stale stored count. This operation updates the saved count without requesting demographic breakdowns. The total aggregation privacy floor still applies. Records are not purchased or exported; backend compute telemetry is recorded. Requires ''discovery'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Count result.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - segment_id
                - record_count
                properties:
                  segment_id:
                    type: string
                  record_count:
                    type:
                    - integer
                    - 'null'
                    description: Updated record count. Null if the segment is pending or failed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/QueryExecutionError'
  /v1/segments/{id}/demographics:
    get:
      summary: Get demographic breakdown for a segment
      operationId: getSegmentDemographics
      description: 'Returns a computed demographic breakdown for the segment. This is the segment-level primary path: the breakdown is evaluated directly over the segment''s own filter definition — no audience composition (set_logic or exclusions) is applied. For a composed view, use GET /v1/audiences/{id}/demographics on a referencing audience. Works for every subtype: matched, similarity, and propensity segments bridge through a materialized scratch id-set (a 1-membership composition) so the same catalog-driven breakdown logic can run against them. Response is cached server-side for 20 minutes. A population or individual demographic cell below the 50-record privacy floor returns 422 without a partial breakdown. Requires ''discovery'' scope.'
      tags:
      - Segments
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Segment document ID.
      responses:
        '200':
          description: 'Demographic breakdown.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - segment_id
                - segment_name
                - total_count
                - age_breakdown
                - geo_breakdown
                - generated_at
                properties:
                  segment_id:
                    type: string
                  segment_name:
                    type: string
                  total_count:
                    type: integer
                    description: Total records matching the segment's filter definition.
                  age_breakdown:
                    type: array
                    items:
                      type: object
                      required:
                      - label
                      - pct
                      properties:
                        label:
                          type: string
                          description: Age bucket label.
                        pct:
                          type: number
                          description: Percentage of total_count in this bucket (0-100, rounded).
                  geo_breakdown:
                    type: array
                    items:
                      type: object
                      required:
                      - label
                      - count
                      properties:
                        label:
                          type: string
                          description: Geography value (e.g. state).
                        count:
                          type: integer
                  breakdown_extra:
                    type: array
                    description: 'Present only when the query returns a behavioral or financial breakdown alongside age/geo.

                      '
                    items:
                      type: object
                      required:
                      - label
                      - pct
                      properties:
                        label:
                          type: string
                        pct:
                          type: number
                  extra_field:
                    type: string
                    description: 'Name of the attribute behind breakdown_extra. Present only alongside breakdown_extra.

                      '
                  generated_at:
                    type: string
                    format: date-time
              example:
                segment_id: seg_abc123
                segment_name: Sun Belt homeowners
                total_count: 182400
                age_breakdown:
                - label: 25-34
                  pct: 22
                - label: 35-44
                  pct: 31
                geo_breakdown:
                - label: AZ
                  count: 61200
                - label: TX
                  count: 121200
                generated_at: '2026-07-05T18:04:11.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AggregationFloorNotMet'
        '502':
          $ref: '#/components/responses/QueryExecutionError'
  /v1/segments/{id}/audiences:
    get:
      summary: List audiences referencing a segment
      operationId: getSegmentAudiences
      description: Returns all non-deleted audiences that include this segment, with campaign linkage — enables cross-campaign segment usage navigation. Requires 'discovery' scope.
      tags:
