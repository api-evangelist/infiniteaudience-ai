  name: Infinite Audience Triggers API
  description: >-
    Durable, per-event-filtered webhook-trigger subscriptions (e.g. one per Zap) — distinct from the single
    implicit URL configured under the Webhooks tag / `/v1/settings/webhook`. Delivery is retried with
    exponential backoff and dead-lettered after repeated failures. An OAuth-authenticated caller manages
    only the subscriptions created by its own connection; an API-key/session caller with 'account' scope
    manages every subscription in the org.
